name: ci
on:
  pull_request:
  push:
    branches: [master]

# Read-only by default: this workflow only builds and tests.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint (ESLint + Stylelint + markdownlint)
        run: npm run lint
      - name: Typecheck (tsc)
        run: npm run typecheck
      - name: Build the PWA and the Worker
        run: npm run build
      # The game core, shared/ and the client in plain Vitest, plus the Worker
      # projects (`worker` and the serial `worker-serial` Durable Object WebSocket
      # project) with Istanbul coverage.
      - name: Unit tests (Vitest)
        run: npm test
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: client
      # Against the built Worker in local workerd, through wrangler's
      # createTestHarness(). Playwright's global setup runs the build itself.
      - name: E2E tests (Playwright)
        run: npm run test:e2e
        env:
          CI: "true"

  # The Cloudflare target: package the release file exactly as a release would and
  # play a real Game against it under `wrangler dev`. It is the drift check between
  # deploy/wrangler.jsonc and the config template the release file ships, and the
  # only way a pull request finds out that a Cloudflare deploy still works —
  # nothing here has an account to deploy to (ADR-0008).
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the PWA and the Worker
        run: npm run build
      - name: Package the Cloudflare release file
        run: npm run release:cloudflare
      # Renders the config with the release's own deploy script, runs wrangler on
      # the bundle, creates a Game, joins it, opens the sockets, sends a position
      # and receives game_state.
      - name: End-to-end check against the release file
        run: npm run test:release

  # The self-hosted target: build the image and play a real Game against it. This
  # is the drift check between deploy/config.capnp and deploy/wrangler.jsonc —
  # nothing generates one from the other, so only a running image proves the
  # bundle still has every binding it needs.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # The check itself needs `ws`, the only WebSocket client that can send the
      # Seat cookie and the Origin header the upgrade is checked against.
      - run: npm ci
      - name: Build the workerd image
        run: docker build -f deploy/Dockerfile --build-arg MANHUNT_VERSION="$MANHUNT_VERSION" -t "$IMAGE:$TAG" .
        env:
          IMAGE: ghcr.io/sschorer/manhunt
          TAG: ci
          MANHUNT_VERSION: ${{ github.sha }}
      # Creates a Game, joins it, opens the sockets, sends a position, receives
      # game_state — then restarts the container and finds the Game still there.
      - name: End-to-end check against the image
        run: npm run test:docker
        env:
          IMAGE: ghcr.io/sschorer/manhunt
          TAG: ci
